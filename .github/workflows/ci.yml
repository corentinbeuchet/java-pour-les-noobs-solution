name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Rendre gradlew exécutable (dépôt alimenté par upload web)
        run: chmod +x ./gradlew
      - name: Build et tests des 5 TP
        run: ./gradlew build --no-daemon
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-de-tests
          path: tp*/build/reports/tests/test
